<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard  - Sprout</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&family=Fraunces:ital,wght@1,700;1,800;1,900&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&family=Fraunces:ital,wght@1,700;1,800;1,900&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg:          #0a1610;
    --surface-1:   #131f18;
    --surface-2:   #1a2a20;
    --surface-3:   #243528;
    --border-1:    #1f2d24;
    --border-2:    #2d4234;
    --sp-peach-100: #f4cba0;
    --sp-peach-200: #e8a87c;
    --sp-peach-400: #e8a87c;
    --sp-peach-500: #d68a5b;
    --sp-peach-soft: rgba(232, 168, 124, 0.10);
    --sp-forest-300: #5ba886;
    --sp-forest-500: #3d7458;
    --sp-forest-700: #3d7458;
    --sp-cream:    #f4cba0;
    --sp-teal-300: #9ED8B8;
    --sp-teal-400: #7CC4A4;
    --sp-teal-500: #5BA886;
    --sp-crimson:  #D65A54;
    --text-1: #f5f7f4;
    --text-2: #a3b0a7;
    --text-3: #6f7d74;
    --text-mute: #4a5650;
    --font-display: 'Plus Jakarta Sans', system-ui, sans-serif;
    --font-body:    'Inter', system-ui, sans-serif;
    --font-mono:    'JetBrains Mono', 'SF Mono', monospace;
    --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-pill: 999px;
    --header-h: 60px; --marquee-h: 30px; --sidebar-w: 240px;
  --mascot-sm:   22px;
  --mascot-md:   30px;
  --mascot-lg:   40px;
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
  }

/* === Mood B signature glow (locked 2026-05-05  - SPROUT_UI_SPEC.md §1.3a) === */
/* Do NOT modify without updating spec section 1.3a first. */
body {
  background: var(--bg);
  background-image:
    radial-gradient(ellipse 800px 400px at 20% 0%, rgba(232,168,124,0.06), transparent 60%),
    radial-gradient(ellipse 600px 400px at 90% 30%, rgba(124,196,164,0.05), transparent 60%);
  background-attachment: fixed;
}
.logo-mascot {
  box-shadow: 0 0 24px rgba(232,168,124,0.35), inset 0 1px 0 rgba(255,255,255,0.2);
}
.btn-primary {
  box-shadow: 0 0 20px rgba(232,168,124,0.30);
}
.marquee-track .peach { color: var(--sp-peach-200); text-shadow: 0 0 12px rgba(232,168,124,0.4); }
.marquee-track .teal  { color: var(--sp-teal-300);  text-shadow: 0 0 12px rgba(124,196,164,0.4); }
.token-card.featured, .tk-card.featured, .card.featured {
  border-color: rgba(232,168,124,0.55);
  background: radial-gradient(ellipse 300px 200px at 100% 0%, rgba(232,168,124,0.10), transparent 70%), var(--surface-1);
  box-shadow: 0 0 32px rgba(232,168,124,0.18), inset 0 1px 0 rgba(255,255,255,0.04);
}
.token-card:hover, .tk-card:hover {
  box-shadow: 0 0 24px rgba(124,196,164,0.08);
}
.token-av, .tk-av { box-shadow: 0 0 16px rgba(124,196,164,0.15); }
.bar-fill { box-shadow: 0 0 10px rgba(232,168,124,0.5); }
/* === end Mood B glow === */

* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text-1); font-family:var(--font-body); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; }
.header { position:fixed; top:0; left:0; right:0; height:var(--header-h); background:var(--surface-1); border-bottom:1px solid var(--border-1); z-index:100; display:flex; align-items:center; padding:0 24px; gap:24px; }
.logo { display:flex; align-items:center; gap:10px; flex-shrink:0; text-decoration:none; cursor:pointer; }
.logo-mascot { width: var(--mascot-lg); height: var(--mascot-lg); border-radius:10px; background:linear-gradient(180deg,#e8a87c,#e8a87c); display:grid; place-items:center; flex-shrink:0; }
.logo-text { font-family:var(--font-display); font-size:17px; font-weight:800; color:var(--sp-peach-400); }
.logo-sub { display:block; font-size:9px; font-weight:600; color:var(--text-3); letter-spacing:0.06em; text-transform:lowercase; }
.header-search { position:relative; flex:1; max-width:480px; }
.header-search input { width:100%; height:36px; padding:0 14px 0 38px; background:var(--surface-2); border:1px solid var(--border-1); border-radius:var(--r-md); color:var(--text-1); font-size:13.5px; font-family:inherit; }
.header-search input:focus { outline:none; border-color:var(--sp-peach-400); }
.header-search svg { position:absolute; left:12px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--text-3); }
.header-actions { display:flex; gap:8px; margin-left:auto; align-items:center; }
.btn-ghost { height:36px; padding:0 14px; background:transparent; border:1px solid var(--border-2); border-radius:var(--r-md); color:var(--text-2); font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
.btn-primary { height:36px; padding:0 16px; background:linear-gradient(180deg,#e8a87c,#e8a87c); border:none; border-radius:var(--r-md); color:#2a1505; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; }
.marquee { position:fixed; top:var(--header-h); left:0; right:0; height:var(--marquee-h); background:var(--bg); border-bottom:1px solid var(--border-1); overflow:hidden; display:flex; align-items:center; z-index:99; }
.marquee-track { display:flex; gap:36px; white-space:nowrap; animation:scroll 40s linear infinite; font-family:var(--font-display); font-size:11px; font-weight:700; letter-spacing:0.08em; color:var(--text-3); }
.marquee-track .peach { color:var(--sp-peach-400); }
.marquee-track .teal { color:var(--sp-teal-400); }
@keyframes scroll { 0% { transform:translateX(0); } 100% { transform:translateX(-50%); } }
.sidebar { position:fixed; left:0; top:calc(var(--header-h) + var(--marquee-h)); bottom:0; width:var(--sidebar-w); background:var(--surface-1); border-right:1px solid var(--border-1); padding:20px 14px; overflow-y:auto; display:flex; flex-direction:column; gap:18px; }
.nav-group { display:flex; flex-direction:column; gap:1px; }
.nav-label { font-family:var(--font-display); font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-3); padding:0 12px 6px; }
.nav-item { display:flex; align-items:center; gap:12px; padding:9px 12px; border-radius:var(--r-md); color:var(--text-2); font-size:13.5px; font-weight:500; cursor:pointer; transition:all 0.12s; text-decoration:none; }
.nav-item svg { width:17px; height:17px; flex-shrink:0; opacity:0.85; }
.nav-item:hover { background:var(--surface-2); color:var(--text-1); }
.nav-item.active { color:var(--sp-peach-400); background:var(--sp-peach-soft); font-weight:600; }
.nav-badge { margin-left:auto; background:var(--sp-crimson); color:white; font-size:10px; font-weight:700; padding:1px 6px; border-radius:var(--r-pill); }
.user-card { margin-top:auto; background:var(--surface-2); border:1px solid var(--border-1); border-radius:var(--r-md); padding:10px; display:flex; align-items:center; gap:10px; cursor:pointer; }
.user-mascot { width: var(--mascot-lg); height: var(--mascot-lg); border-radius:var(--r-pill); background:var(--surface-3); display:grid; place-items:center; border:1.5px solid var(--sp-peach-400); }
.user-name { font-size:12.5px; font-weight:600; color:var(--text-1); }
.user-tier { font-size:10.5px; color:var(--sp-peach-400); font-weight:700; margin-top:1px; }
.main { margin-left:var(--sidebar-w); margin-top:calc(var(--header-h) + var(--marquee-h)); padding:28px 32px 60px; max-width:1100px; }
.page-title { font-family:var(--font-display); font-size:28px; font-weight:800; color:var(--text-1); letter-spacing:-0.02em; margin-bottom:4px; }
.page-sub { font-size:13px; color:var(--text-3); margin-bottom:20px; }
.ev-tabs { display:flex; gap:6px; margin-bottom:24px; }
.ev-tab { padding:7px 16px; background:transparent; border:1px solid var(--border-1); border-radius:var(--r-pill); color:var(--text-2); font-size:13px; font-weight:600; cursor:pointer; transition:all 0.15s; font-family:inherit; display:inline-flex; align-items:center; gap:6px; }
.ev-tab:hover { color:var(--text-1); border-color:var(--border-2); }
.ev-tab.active { background:var(--sp-peach-400); border-color:var(--sp-peach-400); color:#2a1505; }
.ev-count { background:rgba(0,0,0,0.25); border-radius:var(--r-pill); padding:1px 7px; font-size:11px; font-weight:700; }
.ev-list { display:flex; flex-direction:column; gap:14px; }
.ev-card { border-radius:var(--r-lg); padding:24px 28px; display:flex; align-items:center; gap:20px; cursor:pointer; transition:transform 0.15s, box-shadow 0.15s; border:1px solid rgba(255,255,255,0.06); }
.ev-card:hover { transform:translateY(-2px); box-shadow:0 8px 32px rgba(0,0,0,0.4); }
.ev-card[style*="display:none"] { display:none !important; }
.ev-card-body { flex:1; min-width:0; }
.ev-badge { display:inline-block; padding:3px 9px; border-radius:var(--r-pill); font-size:10.5px; font-weight:700; letter-spacing:0.04em; margin-bottom:8px; font-family:var(--font-display); }
.ev-title { font-family:var(--font-display); font-size:19px; font-weight:700; color:#fff; margin-bottom:5px; letter-spacing:-0.01em; }
.ev-desc { font-size:13px; color:rgba(255,255,255,0.65); margin-bottom:12px; }
.ev-meta { display:flex; align-items:center; gap:16px; font-size:12px; color:rgba(255,255,255,0.55); }
.ev-status { display:inline-flex; align-items:center; gap:5px; font-weight:600; }
.ev-live-dot { width:7px; height:7px; border-radius:50%; background:#22c55e; display:inline-block; animation:pulse 1.5s infinite; }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
.ev-card-right { display:flex; flex-direction:column; align-items:center; gap:12px; flex-shrink:0; }
.ev-icon { width:52px; height:52px; border-radius:var(--r-md); background:rgba(255,255,255,0.15); display:grid; place-items:center; border:1px solid rgba(255,255,255,0.2); }
.ev-icon svg { width:24px; height:24px; stroke:rgba(255,255,255,0.9); }
.ev-btn { padding:8px 18px; border-radius:var(--r-md); font-size:13px; font-weight:700; cursor:pointer; font-family:var(--font-display); transition:all 0.12s; white-space:nowrap; border:none; }
.ev-btn-join { background:rgba(255,255,255,0.18); color:#fff; border:1px solid rgba(255,255,255,0.3); }
.ev-btn-join:hover { background:rgba(255,255,255,0.28); }
.ev-btn-soon { background:rgba(0,0,0,0.25); color:rgba(255,255,255,0.5); border:1px solid rgba(255,255,255,0.1); cursor:default; }
.ev-btn-view { background:rgba(255,255,255,0.18); color:#fff; border:1px solid rgba(255,255,255,0.3); }
.ev-btn-view:hover { background:rgba(255,255,255,0.28); }

/* ===================== LEADERBOARD PAGE CSS ===================== */

/* Top 3 grid */
.top3-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
  margin-bottom: 28px;
}

/* Featured card */
.lb-card {
  background:
    radial-gradient(ellipse 120% 80% at 10% 0%, rgba(234,181,82,0.12), transparent 55%),
    radial-gradient(ellipse 80% 100% at 90% 100%, rgba(92,168,134,0.10), transparent 60%),
    var(--surface-1);
  border: 1px solid var(--border-1);
  border-radius: var(--r-lg);
  padding: 22px;
  position: relative;
  cursor: pointer;
  transition: transform 0.18s var(--ease), border-color 0.18s var(--ease);
}
.lb-card:hover {
  transform: translateY(-3px);
  border-color: var(--sp-peach-400);
}
.lb-card.rank-1 { border-color: rgba(234,181,82,0.35); }
.lb-card.rank-2 { border-color: rgba(156,216,184,0.2); }

.rank-badge {
  font-family: var(--font-mono);
  font-size: 11.5px;
  font-weight: 700;
  color: var(--text-mute);
  letter-spacing: 0.06em;
  margin-bottom: 16px;
}
.lb-card.rank-1 .rank-badge { color: var(--sp-peach-400); }
.lb-card.rank-2 .rank-badge { color: var(--sp-teal-400); }

.lb-card-head {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  margin-bottom: 14px;
}
.lb-avatar {
  width: 64px;
  height: 64px;
  border-radius: var(--r-md);
  flex-shrink: 0;
  overflow: hidden;
  display: grid;
  place-items: center;
}
.lb-token-info { flex: 1; min-width: 0; }
.lb-token-name {
  font-family: var(--font-display);
  font-size: 19px;
  font-weight: 800;
  color: var(--sp-peach-400);
  margin-bottom: 2px;
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.lb-tagline {
  font-size: 11.5px;
  color: var(--text-3);
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.lb-buy {
  height: 32px;
  padding: 0 16px;
  background: var(--sp-teal-500);
  border: none;
  border-radius: var(--r-md);
  color: #ecfeff;
  font-family: var(--font-display);
  font-size: 12.5px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s;
  flex-shrink: 0;
  align-self: flex-start;
}
.lb-buy:hover { background: var(--sp-teal-400); }

.lb-metrics {
  display: flex;
  flex-direction: column;
  gap: 5px;
  margin-bottom: 14px;
  font-size: 13px;
}
.lb-metric-row {
  display: flex;
  align-items: baseline;
  gap: 6px;
  color: var(--text-3);
}
.lb-metric-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
.lb-metric-val {
  font-family: var(--font-mono);
  font-weight: 600;
  color: var(--text-1);
  font-size: 13px;
}
.lb-metric-change {
  font-family: var(--font-mono);
  font-size: 11.5px;
  font-weight: 600;
}

.lb-creator {
  display: flex;
  align-items: center;
  gap: 8px;
  padding-top: 12px;
  border-top: 1px solid var(--border-1);
  font-size: 11.5px;
  color: var(--text-3);
}
.lb-creator-avatar {
  width: 22px;
  height: 22px;
  border-radius: var(--r-pill);
  flex-shrink: 0;
  border: 1px solid var(--border-2);
}
.lb-creator-name { color: var(--text-2); font-weight: 500; }
.lb-creator-age { margin-left: auto; color: var(--text-mute); }

/* Table */
.lb-table {
  background: var(--surface-1);
  border: 1px solid var(--border-1);
  border-radius: var(--r-lg);
  overflow: hidden;
}
.lb-table-header {
  display: grid;
  grid-template-columns: 2.2fr 1.4fr 0.8fr 1.1fr 0.5fr;
  padding: 12px 20px;
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-3);
  border-bottom: 1px solid var(--border-1);
}
.lb-row {
  display: grid;
  grid-template-columns: 2.2fr 1.4fr 0.8fr 1.1fr 0.5fr;
  align-items: center;
  padding: 13px 20px;
  border-top: 1px solid var(--border-1);
  cursor: pointer;
  transition: background 0.12s var(--ease);
}
.lb-row:first-child { border-top: none; }
.lb-row:hover { background: var(--surface-2); }

.lb-row-token {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}
.lb-row-avatar {
  width: 40px;
  height: 40px;
  border-radius: var(--r-sm);
  flex-shrink: 0;
  overflow: hidden;
  display: grid;
  place-items: center;
}
.lb-row-name {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 700;
  color: var(--text-1); /* Group A #5: roster rows desaturate to white */
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.lb-row-rank {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-mute);
  margin-top: 1px;
}

.lb-row-creator {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
  font-size: 12.5px;
  color: var(--text-2);
}
.lb-row-creator-av {
  width: 20px;
  height: 20px;
  border-radius: var(--r-pill);
  flex-shrink: 0;
  border: 1px solid var(--border-2);
}
.lb-row-holders {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--text-2);
}
.lb-row-mc {
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.lb-row-mc-val {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 600;
  color: var(--text-1);
}
.lb-row-mc-change {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
}
.lb-row-buy {
  height: 30px;
  padding: 0 14px;
  background: transparent;
  border: 1px solid var(--border-2);
  border-radius: var(--r-md);
  color: var(--text-2);
  font-family: var(--font-display);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.12s;
}
.lb-row-buy:hover {
  border-color: var(--sp-teal-400);
  color: var(--sp-teal-400);
}

/* Color helpers */
.c-up { color: var(--sp-teal-400); }
.c-down { color: var(--sp-crimson); }
.c-flat { color: var(--text-3); }


/* ===== CONNECTED WALLET ===== */
.wallet-connected { position: relative; height: 36px; background: var(--surface-2); border: 1px solid var(--border-2); border-radius: var(--r-pill); padding: 3px 12px 3px 4px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; transition: all 0.15s var(--ease); font-family: var(--font-body); }
.wallet-connected:hover { border-color: var(--sp-peach-400); background: var(--sp-peach-soft); }
.wallet-connected.open { border-color: var(--sp-peach-400); }
.wc-avatar { width: var(--mascot-md); height: var(--mascot-md); border-radius: 50%; background: linear-gradient(180deg,#e8a87c,#e8a87c); display: grid; place-items: center; flex-shrink: 0; }
.wc-avatar svg { width: 18px; height: 18px; }
.wc-info { display: flex; flex-direction: column; line-height: 1.1; min-width: 0; }
.wc-balance { font-family: var(--font-mono); font-size: 12.5px; font-weight: 700; color: var(--sp-peach-400); }
.wc-addr { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-3); margin-top: 1px; }
.wc-chevron { width: 12px; height: 12px; color: var(--text-3); flex-shrink: 0; transition: transform 0.15s var(--ease); }
.wallet-connected.open .wc-chevron { transform: rotate(180deg); color: var(--sp-peach-400); }
.wc-net-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--sp-teal-400); flex-shrink: 0; box-shadow: 0 0 0 2px rgba(124,196,164,0.20); }
.wc-net-dot.wrong { background: var(--sp-crimson); box-shadow: 0 0 0 2px rgba(214,90,84,0.20); }
.wc-menu { position: absolute; top: calc(100% + 8px); right: 0; width: 220px; background: var(--surface-1); border: 1px solid var(--border-1); border-radius: var(--r-md); padding: 6px; display: none; z-index: 200; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
.wallet-connected.open .wc-menu { display: block; }
.wc-menu-head { padding: 10px 10px 8px; border-bottom: 1px solid var(--border-1); margin-bottom: 4px; }
.wc-menu-net { font-size: 10.5px; color: var(--text-3); font-family: var(--font-display); font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
.wc-menu-bal { font-family: var(--font-mono); font-size: 16px; font-weight: 700; color: var(--text-1); margin-top: 2px; }
.wc-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-sm); color: var(--text-1); font-size: 13px; font-weight: 500; cursor: pointer; text-decoration: none; width: 100%; background: transparent; border: none; font-family: inherit; text-align: left; transition: background 0.12s var(--ease); }
.wc-item:hover { background: var(--surface-2); }
.wc-item svg { width: 14px; height: 14px; flex-shrink: 0; opacity: 0.7; }
.wc-item.danger { color: var(--sp-crimson); }
.wc-item.danger:hover { background: rgba(214,90,84,0.10); }
.wc-divider { height: 1px; background: var(--border-1); margin: 4px 0; }

  /* === Patch 4a: Sidebar footer utility block === */
  .sidebar-footer { padding: 12px 16px; border-top: 1px solid var(--border-1); display: flex; flex-direction: column; gap: 10px; }
  .sf-social { display: flex; gap: 12px; }
  .sf-social a { color: var(--text-3); display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; transition: color 0.15s; text-decoration: none; }
  .sf-social a:hover { color: var(--sp-peach-400); }
  .sf-pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .sf-pill { font-size: 10.5px; font-weight: 600; color: var(--text-3); background: var(--surface-2); padding: 4px 10px; border-radius: 999px; text-decoration: none; transition: all 0.15s; }
  .sf-pill:hover { color: var(--sp-peach-400); background: var(--sp-peach-soft); }
  .sf-copyright { font-size: 10px; color: var(--text-mute); text-align: center; margin-top: 2px; }
  /* === Patch 4b: Active item glow + group label refinement === */
  .nav-item.active {
    box-shadow: 0 0 16px rgba(232, 168, 124, 0.18);
  }
  .nav-label {
    letter-spacing: 0.12em;
    position: relative;
    padding-left: 14px;
  }
  .nav-label::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--sp-peach-400);
    opacity: 0.6;
  }
  /* === Patch 4c: User card anchor + tier-aware points color === */
  .user-card {
    box-shadow: 0 0 20px rgba(232, 168, 124, 0.10);
    border-top: 1px solid rgba(232, 168, 124, 0.20);
  }
  .uc-pts.tier-seed,
  .uc-pts.tier-sprout      { color: var(--text-1); }
  .uc-pts.tier-sapling     { color: var(--sp-peach-400); }
  .uc-pts.tier-tree        { color: var(--sp-teal-400); }
  .uc-pts.tier-ancient     { color: var(--sp-peach-200); text-shadow: 0 0 8px rgba(232,168,124,0.4); }
  /* === Patch 7: Hover lift micro-interaction === */
  .nav-item {
    transition: transform 0.15s var(--ease, ease), background 0.15s var(--ease, ease), color 0.12s var(--ease, ease), box-shadow 0.12s var(--ease, ease);
  }
  .nav-item:hover {
    transform: translateY(-1px);
    background: var(--sp-peach-soft);
    color: var(--text-1);
  }
  .nav-item.active:hover {
    transform: none;
  }
  /* === Patch 5: Peach stroke icons  - color via currentColor only === */
  .nav-item .icon {
    color: var(--sp-peach-200);
    opacity: 0.85;
    transition: fill 0.15s, color 0.15s, opacity 0.15s;
  }
  .nav-item.active .icon {
    color: var(--sp-peach-400);
    opacity: 1;
  }
  .nav-item:hover:not(.active) .icon {
    color: var(--sp-peach-100);
    opacity: 1;
  }

  .sidebar > .nav-group + .nav-group { margin-top: 0 !important; }

  /* (3) Hide edition chip */
  .wild-edition { display: none !important; }

  /* (4) v0.6 FIX — unify nav-item PILL background (not the sticker icon).

  .sidebar .nav-item,
  .sidebar .nav-item:nth-of-type(6n+1),
  .sidebar .nav-item:nth-of-type(6n+2),
  .sidebar .nav-item:nth-of-type(6n+3),
  .sidebar .nav-item:nth-of-type(6n+4),
  .sidebar .nav-item:nth-of-type(6n+5),
