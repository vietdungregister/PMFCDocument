        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
        }
        
        /* Sidebar */
        .sidebar {
            width: 260px;
            background: var(--card2);
            border-right: 1px solid var(--card-boarder);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }
        
        .logo {
            padding: 0 20px 20px 20px;
            border-bottom: 1px solid var(--card-boarder);
            margin-bottom: 20px;
        }
        
        .logo-text {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary);
        }
        
        .nav-section {
            margin-bottom: 24px;
        }
        
        .nav-section-title {
            padding: 0 20px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
        }
        
        .nav-item:hover {
            background: var(--card-hover);
            color: var(--accent);
        }
        
        .nav-item.active {
            background: rgba(16, 185, 129, 0.1);
            color: var(--primary);
            border-left: 3px solid var(--primary);
        }
        
        .nav-icon {
            font-size: 18px;
            width: 20px;
            text-align: center;
        }
        
        .user-section {
            margin-top: auto;
            padding: 20px;
            border-top: 1px solid var(--card-boarder);
        }
        
        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--card);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .user-profile:hover {
            background: var(--card-hover);
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        
        .user-info {
            flex: 1;
        }
        
        .user-name {
            font-size: 14px;
            font-weight: 600;
        }
        
        .user-wallet {
            font-size: 12px;
            color: var(--text-tertiary);
            font-family: monospace;
        }
        
        /* Main Content */
        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 40px;
        }
        
        .page-header {
            margin-bottom: 32px;
        }
        
        .page-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        
        .page-subtitle {
            font-size: 16px;
            color: var(--text-secondary);
        }
        
        .content-placeholder {
            background: var(--card);
            padding: 60px;
            border-radius: 12px;
            border: 1px solid var(--card-boarder);
            text-align: center;
            color: var(--text-secondary);
        }
      /* === Patch 4a: Sidebar footer utility block === */
  .sidebar-footer { padding: 12px 16px; border-top: 1px solid var(--border-1); display: flex; flex-direction: column; gap: 10px; }
  .sf-social { display: flex; gap: 12px; }
  .sf-social a { color: var(--text-3); display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; transition: color 0.15s; text-decoration: none; }
  .sf-social a:hover { color: var(--sp-peach-400); }
  .sf-pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .sf-pill { font-size: 10.5px; font-weight: 600; color: var(--text-3); background: var(--surface-2); padding: 4px 10px; border-radius: 999px; text-decoration: none; transition: all 0.15s; }
  .sf-pill:hover { color: var(--sp-peach-400); background: var(--sp-peach-soft); }
  .sf-copyright { font-size: 10px; color: var(--text-mute); text-align: center; margin-top: 2px; }
  /* === Patch 4b: Active item glow + group label refinement === */
  .nav-item.active {
    box-shadow: 0 0 16px rgba(232, 168, 124, 0.18);
  }
  .nav-label {
    letter-spacing: 0.12em;
    position: relative;
    padding-left: 14px;
  }
  .nav-label::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--sp-peach-400);
    opacity: 0.6;
  }
  /* === Patch 4c: User card anchor + tier-aware points color === */
  .user-card {
    box-shadow: 0 0 20px rgba(232, 168, 124, 0.10);
    border-top: 1px solid rgba(232, 168, 124, 0.20);
  }
  .uc-pts.tier-seed,
  .uc-pts.tier-sprout      { color: var(--text-1); }
  .uc-pts.tier-sapling     { color: var(--sp-peach-400); }
  .uc-pts.tier-tree        { color: var(--sp-teal-400); }
  .uc-pts.tier-ancient     { color: var(--sp-peach-200); text-shadow: 0 0 8px rgba(232,168,124,0.4); }
  /* === Patch 7: Hover lift micro-interaction === */
  .nav-item {
    transition: transform 0.15s var(--ease, ease), background 0.15s var(--ease, ease), color 0.12s var(--ease, ease), box-shadow 0.12s var(--ease, ease);
  }
  .nav-item:hover {
    transform: translateY(-1px);
    background: var(--sp-peach-soft);
    color: var(--text-1);
  }
  .nav-item.active:hover {
    transform: none;
  }
  /* === Patch 5: Peach stroke icons — color via currentColor only === */
  .nav-item .icon {
    color: var(--sp-peach-200);
    opacity: 0.85;
    transition: fill 0.15s, color 0.15s, opacity 0.15s;
  }
  .nav-item.active .icon {
    color: var(--sp-peach-400);
    opacity: 1;
  }
  .nav-item:hover:not(.active) .icon {
    color: var(--sp-peach-100);
    opacity: 1;
  }

:root {

  --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-pill: 999px;

  --mascot-sm: 22px; --mascot-md: 30px; --mascot-lg: 40px;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  /* legacy aliases for broken-token files */
  --card:           var(--surface-1);

  --primary:        var(--sp-peach-400);

}
body {
  background: var(--bg) !important;
  background-image:
    radial-gradient(ellipse 800px 400px at 20% 0%, rgba(232,168,124,0.06), transparent 60%),
    radial-gradient(ellipse 600px 400px at 90% 30%, rgba(124,196,164,0.05), transparent 60%) !important;
  background-attachment: fixed !important;
  color: var(--text-1);
  font-family: var(--font-body);
}
.marquee {
  position: fixed; top: 0; left: 0; right: 0;
  height: var(--marquee-h);
  background: var(--surface-1);
  border-bottom: 1px solid var(--border-1);
  overflow: hidden; display: flex; align-items: center; z-index: 100;
}
.marquee-track {
  display: flex; gap: 36px; white-space: nowrap;
  animation: marqueeScroll 42s linear infinite;
  font-family: var(--font-display);
  font-size: 12px; font-weight: 700; letter-spacing: 0.12em;
  color: var(--text-3);
}
.marquee:hover .marquee-track { animation-duration: 14s; }
.marquee-track .peach { color: var(--sp-peach-400); text-shadow: 0 0 12px rgba(232,168,124,0.35); }
.marquee-track .teal  { color: var(--sp-teal-400); text-shadow: 0 0 12px rgba(124,196,164,0.35); }
@keyframes marqueeScroll { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }
/* === end Recovery R2 Wild base === */
