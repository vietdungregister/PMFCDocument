<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Navigation — Sprout</title>
    <style>
        :root {
    --bg:          #0a1610;
    --surface-1:   #131f18;
    --surface-2:   #1a2a20;
    --surface-3:   #243528;
    --border-1:    #1f2d24;
    --border-2:    #2d4234;
    --sp-peach-100: #f4cba0;
    --sp-peach-200: #e8a87c;
    --sp-peach-400: #e8a87c;
    --sp-peach-500: #d68a5b;
    --sp-peach-soft: rgba(232, 168, 124, 0.10);
    --sp-forest-300: #5ba886;
    --sp-forest-500: #3d7458;
    --sp-forest-700: #3d7458;
    --sp-cream:    #f4cba0;
    --sp-teal-300: #9ED8B8;
    --sp-teal-400: #7CC4A4;
    --sp-teal-500: #5BA886;
    --sp-crimson:  #D65A54;
    --text-1: #f5f7f4;
    --text-2: #a3b0a7;
    --text-3: #6f7d74;
    --text-mute: #4a5650;
    --font-display: 'Plus Jakarta Sans', system-ui, sans-serif;
    --font-body:    'Inter', system-ui, sans-serif;
    --font-mono:    'JetBrains Mono', 'SF Mono', monospace;
    --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-pill: 999px;
    --header-h: 60px; --marquee-h: 30px; --sidebar-w: 240px;
  --mascot-sm:   22px;
  --mascot-md:   30px;
  --mascot-lg:   40px;
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
  }

/* === Mood B signature glow (locked 2026-05-05 — SPROUT_UI_SPEC.md §1.3a) === */
/* Do NOT modify without updating spec section 1.3a first. */
body {
  background: var(--bg);
  background-image:
    radial-gradient(ellipse 800px 400px at 20% 0%, rgba(232,168,124,0.06), transparent 60%),
    radial-gradient(ellipse 600px 400px at 90% 30%, rgba(124,196,164,0.05), transparent 60%);
  background-attachment: fixed;
}
.logo-mascot {
  box-shadow: 0 0 24px rgba(232,168,124,0.35), inset 0 1px 0 rgba(255,255,255,0.2);
}
.btn-primary {
  box-shadow: 0 0 20px rgba(232,168,124,0.30);
}
.marquee-track .peach { color: var(--sp-peach-200); text-shadow: 0 0 12px rgba(232,168,124,0.4); }
.marquee-track .teal  { color: var(--sp-teal-300);  text-shadow: 0 0 12px rgba(124,196,164,0.4); }
.token-card.featured, .tk-card.featured, .card.featured {
  border-color: rgba(232,168,124,0.55);
  background: radial-gradient(ellipse 300px 200px at 100% 0%, rgba(232,168,124,0.10), transparent 70%), var(--surface-1);
  box-shadow: 0 0 32px rgba(232,168,124,0.18), inset 0 1px 0 rgba(255,255,255,0.04);
}
.token-card:hover, .tk-card:hover {
  box-shadow: 0 0 24px rgba(124,196,164,0.08);
}
.token-av, .tk-av { box-shadow: 0 0 16px rgba(124,196,164,0.15); }
.bar-fill { box-shadow: 0 0 10px rgba(232,168,124,0.5); }
/* === end Mood B glow === */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
        }
        
        /* Sidebar */
        .sidebar {
            width: 260px;
            background: var(--card2);
            border-right: 1px solid var(--card-boarder);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }
        
        .logo {
            padding: 0 20px 20px 20px;
            border-bottom: 1px solid var(--card-boarder);
            margin-bottom: 20px;
        }
        
        .logo-text {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary);
        }
        
        .nav-section {
            margin-bottom: 24px;
        }
        
        .nav-section-title {
            padding: 0 20px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
        }
        
        .nav-item:hover {
            background: var(--card-hover);
            color: var(--accent);
        }
        
        .nav-item.active {
            background: rgba(16, 185, 129, 0.1);
            color: var(--primary);
            border-left: 3px solid var(--primary);
        }
        
        .nav-icon {
            font-size: 18px;
            width: 20px;
            text-align: center;
        }
        
        .user-section {
            margin-top: auto;
            padding: 20px;
            border-top: 1px solid var(--card-boarder);
        }
        
        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--card);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .user-profile:hover {
            background: var(--card-hover);
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        
        .user-info {
            flex: 1;
        }
        
        .user-name {
            font-size: 14px;
            font-weight: 600;
        }
        
        .user-wallet {
            font-size: 12px;
            color: var(--text-tertiary);
            font-family: monospace;
        }
        
        /* Main Content */
        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 40px;
        }
        
        .page-header {
            margin-bottom: 32px;
        }
        
        .page-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        
        .page-subtitle {
            font-size: 16px;
            color: var(--text-secondary);
        }
        
        .content-placeholder {
            background: var(--card);
            padding: 60px;
            border-radius: 12px;
            border: 1px solid var(--card-boarder);
            text-align: center;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <!-- Logo -->
        <div class="logo" onclick="location.href='token_list_v4.html'" style="cursor:pointer" style="display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0">
  <div class="logo-mascot" style="width:var(--mascot-lg);height:var(--mascot-lg);border-radius:10px;background:linear-gradient(180deg,#e8a87c,#e8a87c);display:grid;place-items:center;flex-shrink:0">
    <svg viewBox="0 0 64 64" fill="none">
        <ellipse cx="32" cy="46" rx="16" ry="11" fill="#8B4513"/>
        <ellipse cx="24" cy="28" rx="6" ry="11" transform="rotate(-25 24 28)" fill="#7cc4a4"/>
        <ellipse cx="40" cy="28" rx="6" ry="11" transform="rotate(25 40 28)" fill="#5ba886"/>
        <rect x="30" y="30" width="4" height="14" fill="#3d7458"/>
        <circle cx="27" cy="48" r="1.5" fill="#1a1208"/>
        <circle cx="37" cy="48" r="1.5" fill="#1a1208"/>
        <path d="M 27 51 Q 32 53.5 37 51" stroke="#1a1208" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      </svg>
  </div>
  <div>
    <span class="logo-text" style="font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:17px;font-weight:800;color:#e8a87c;letter-spacing:-0.01em">Sprout</span>
    <span style="display:block;font-size:9px;font-weight:600;color:#6f7d74;letter-spacing:0.06em;text-transform:lowercase">the meme garden</span>
  </div>
</div>
        </div>
        
        <!-- Main Navigation -->
        <div class="nav-section">
            <div class="nav-section-title">Main</div>
            <a href="#" class="nav-item active">
                <span class="nav-icon">🏠</span>
                <span>Token List</span>
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">🏆</span>
                <span>Leaderboard</span>
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">➕</span>
                <span>Create Token</span>
            </a>
        </div>
        
        <!-- Personal -->
        <div class="nav-section">
            <div class="nav-section-title">Personal</div>
            <a href="#" class="nav-item">
                <span class="nav-icon">👤</span>
                <span>My Profile</span>
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">⚙️</span>
                <span>Stall Manager</span>
            </a>
        </div>
        
        <!-- Rewards -->
        <div class="nav-section">
            <div class="nav-section-title">Earn</div>
            <a href="#" class="nav-item">
                <span class="nav-icon">🎁</span>
                <span>Rewards</span>
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">🤝</span>
                <span>Referrals</span>
            </a>
        </div>
        
        <!-- User Profile Section -->
        <div class="user-section">
            <div class="user-profile">
                <div class="user-avatar">D</div>
                <div class="user-info">
                    <div class="user-name">dungdev</div>
                    <div class="user-wallet">7xK9...mP3q</div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Main Content -->
    <div class="main-content">
        <div class="page-header">
            <h1 class="page-title">Welcome to Sprout</h1>
            <p class="page-subtitle">Discover and trade meme tokens on Solana</p>
        </div>
        
        <div class="content-placeholder">
            <h2>Main Content Area</h2>
            <p>Your page content goes here</p>
        </div>
    </div>
</body>
</html>
