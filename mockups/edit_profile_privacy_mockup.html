<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - PumpFun</title>
    <style>
        :root {
            --primary: #10b981;
            --accent: #ffffff;
            --card: #1a1a2e;
            --card2: #16213e;
            --card-hover: #0f1729;
            --card-border: #2d3748;
            --bg: #0a0e1a;
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --text-tertiary: #6b7280;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Avatar Section */
        .avatar-section {
            margin-bottom: 32px;
        }

        .avatar-upload {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .avatar-info {
            flex: 1;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: #059669;
        }

        .file-hint {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-top: 6px;
        }

        /* Form Grid */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
            margin-bottom: 32px;
        }

        .form-column {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Form Group */
        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .form-input {
            width: 100%;
            padding: 12px 14px;
            background: var(--card2);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            line-height: 1.5;
            transition: all 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--card);
        }

        .form-input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: var(--card-hover);
        }

        .form-input::placeholder {
            color: var(--text-tertiary);
        }

        textarea.form-input {
            resize: vertical;
            min-height: 120px;
            font-family: inherit;
        }

        .form-hint {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-top: 6px;
        }

        .char-counter {
            font-size: 12px;
            color: var(--text-tertiary);
            text-align: right;
            margin-top: 6px;
        }

        /* Toggle Section */
        .toggle-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            background: var(--card2);
            border-radius: 8px;
            border: 1px solid var(--card-border);
        }

        .toggle-info {
            flex: 1;
        }

        .toggle-label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .toggle-desc {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Toggle Switch */
        .toggle-switch {
            position: relative;
            width: 50px;
            height: 26px;
            flex-shrink: 0;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #4b5563;
            border-radius: 13px;
            transition: 0.3s;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background: white;
            border-radius: 50%;
            transition: 0.3s;
        }

        .toggle-switch input:checked+.toggle-slider {
            background: var(--primary);
        }

        .toggle-switch input:checked+.toggle-slider:before {
            transform: translateX(24px);
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 32px;
        }

        .action-buttons .btn {
            flex: 1;
            padding: 14px 24px;
            font-size: 15px;
        }

        .btn-secondary {
            background: var(--card);
            color: var(--text-secondary);
            border: 1px solid var(--card-border);
        }

        .btn-secondary:hover {
            background: var(--card-hover);
            color: var(--text-primary);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
                gap: 24px;
            }

            .avatar-upload {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Avatar Section -->
        <div class="avatar-section">
            <label class="form-label">Avatar</label>
            <div class="avatar-upload">
                <div class="avatar">D</div>
                <div class="avatar-info">
                    <button class="btn btn-primary">Change Avatar</button>
                    <div class="file-hint">Max 5MB, JPG/PNG/GIF</div>
                </div>
            </div>
        </div>

        <!-- Form Grid -->
        <div class="form-grid">
            <!-- Left Column -->
            <div class="form-column">
                <!-- Username -->
                <div class="form-group">
                    <label class="form-label">Username * (One-time only)</label>
                    <input type="text" class="form-input" value="dungdev" disabled>
                    <div class="form-hint">🔒 Cannot be changed</div>
                </div>

                <!-- Display Name -->
                <div class="form-group">
                    <label class="form-label">Display Name * (One-time only)</label>
                    <input type="text" class="form-input" value="Dung - Crypto Trader">
                    <div class="form-hint">🔒 Can only be set once</div>
                </div>

                <!-- Bio -->
                <div class="form-group">
                    <label class="form-label">Bio</label>
                    <textarea class="form-input" placeholder="Tell us about yourself" maxlength="200"></textarea>
                    <div class="char-counter"><span id="charCount">0</span> / 200</div>
                </div>
            </div>

            <!-- Right Column -->
            <div class="form-column">
                <!-- Twitter -->
                <div class="form-group">
                    <label class="form-label">Twitter/X</label>
                    <input type="text" class="form-input" placeholder="https://twitter.com/username">
                </div>

                <!-- Telegram -->
                <div class="form-group">
                    <label class="form-label">Telegram</label>
                    <input type="text" class="form-input" placeholder="@username or URL">
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" placeholder="your@email.com">
                </div>

                <!-- Wallet -->
                <div class="form-group">
                    <label class="form-label">Wallet Address</label>
                    <input type="text" class="form-input" value="7xK9...mP3q" disabled>
                    <div class="form-hint">Cannot be changed</div>
                </div>

                <!-- Privacy Toggle -->
                <div class="form-group">
                    <label class="form-label">Privacy Settings</label>
                    <div class="toggle-group">
                        <div class="toggle-info">
                            <div class="toggle-label" id="privacyLabel">Public</div>
                            <div class="toggle-desc">Anyone can view your profile</div>
                        </div>
                        <label class="toggle-switch">
                            <input type="checkbox" id="privacyToggle" onchange="togglePrivacy()">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <button class="btn btn-secondary">Cancel</button>
            <button class="btn btn-primary">Save Changes</button>
        </div>
    </div>

    <script>
        // Character counter
        const textarea = document.querySelector('textarea');
        const charCount = document.getElementById('charCount');

        textarea.addEventListener('input', function () {
            charCount.textContent = this.value.length;
        });

        // Privacy toggle
        function togglePrivacy() {
            const toggle = document.getElementById('privacyToggle');
            const label = document.getElementById('privacyLabel');
            const desc = label.nextElementSibling;

            if (toggle.checked) {
                label.textContent = 'Private';
                desc.textContent = 'Only you can view your profile';
            } else {
                label.textContent = 'Public';
                desc.textContent = 'Anyone can view your profile';
            }
        }
    </script>
</body>

</html>
